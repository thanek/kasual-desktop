name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure apt
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libpulse0 \
            python3-pyqt6 \
            python3-pyqt6.sip \
            python3-pyqt6.qtmultimedia \
            python3-pyqt6.qtwebengine \
            python3-qtawesome \
            python3-evdev \
            python3-xlib \
            python3-pytest \
            python3-pytestqt \
            python3-pytest-subtests \
            layer-shell-qt \
            qt6-wayland

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./test.sh --tb=short -q
