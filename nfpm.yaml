# nfpm descriptor — single source for both .deb and .rpm.
#   nfpm pkg -p deb -t dist/
#   nfpm pkg -p rpm -t dist/
# Version is derived from git tags by the Makefile (KASUAL_VERSION).
# The whole runnable tree is staged under build/stage/usr by `make stage`, so
# this file just packs that staging dir — keeping __file__-relative resource
# paths (src/apps/sounds/locale all under /usr/share/kasual-desktop) intact.
name: kasual-desktop
arch: all
platform: linux
version: ${KASUAL_VERSION}
section: games
priority: optional
maintainer: xis <xis@schowek.net>
description: |
  Gamepad-first launcher/desktop for Wayland: KDE Plasma 6, Sway, Hyprland and
  COSMIC via wlr-layer-shell, GNOME via the bundled Kasual Helper Shell extension.
  Bundles the File Browser and YouTube couch apps.
vendor: Kasual Desktop
homepage: https://github.com/thanek/kasual-desktop
license: GPL-3.0-or-later

contents:
  - src: ./build/stage/usr
    dst: /usr
    type: tree

# Reload udev after install/upgrade so the bundled gamepad access rule
# (packaging/99-kasual-desktop.rules) applies without a reboot. The same
# script runs as %post (rpm), postinst (deb) and post_install (Arch); pacman
# additionally needs post_upgrade to reload on upgrades (the shared postinstall
# runs on install for all three formats, but on upgrade only for deb/rpm).
scripts:
  postinstall: packaging/postinstall.sh

overrides:
  deb:
    depends:
      - python3 (>= 3.11)
      - python3-pyqt6
      - python3-pyqt6.sip
      - python3-pyqt6.qtmultimedia
      - python3-pyqt6.qtwebengine
      - python3-qtawesome
      - python3-evdev
      - python3-xlib
      - layer-shell-qt
      - qt6-wayland
    recommends:
      # Runtime helpers Kasual shells out to. brightnessctl is the only brightness
      # path where KDE's Solid.PowerManagement D-Bus service is absent (Sway,
      # Hyprland), so it stays a Recommends even though apt installs it by default
      # onto hosts that have no kernel backlight and will never use it.
      - pipewire-pulse | pulseaudio-utils
      - network-manager
      - brightnessctl
    suggests:
      - mangohud
  rpm:
    # NOTE: Fedora/openSUSE package names — verify on a real target before a
    # public rpm release (qtwebengine/layer-shell naming differs across distros).
    depends:
      - python3 >= 3.11
      - python3-pyqt6
      - python3-pyqt6-webengine
      - python3-QtAwesome
      - python3-evdev
      - python3-xlib
      - layer-shell-qt
      - qt6-qtwayland
    recommends:
      - pipewire-pulseaudio
      - NetworkManager
      - brightnessctl
    suggests:
      - mangohud
  archlinux:
    # Arch's python-pyqt6 bundles QtMultimedia; QtWebEngine is a separate pkg.
    # nfpm drops recommends/suggests for this packager (they reach no .PKGINFO
    # field), so brightnessctl — the sole brightness path under Sway/Hyprland,
    # which is most of the Arch audience — has to be a hard depend or nothing.
    depends:
      - python
      - python-pyqt6
      - python-pyqt6-webengine
      - python-qtawesome
      - python-evdev
      - python-xlib
      - layer-shell-qt
      - qt6-wayland
      - brightnessctl

# pacman runs post_upgrade (not post_install) on upgrades, so mirror the shared
# postinstall there as well — keeps the udev reload idempotent across package
# updates on Arch.
archlinux:
  scripts:
    postupgrade: packaging/postinstall.sh
